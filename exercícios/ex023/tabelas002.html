<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot{
            background-color: gray;
            color: white;
        }

        td.num{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--
        ANATOMIA PARA TABELAS GRANDES
        TABLE
            THEAD
                TR, TD, TH
            TBODY
                TR, TD, TH
            TFOOT
                TR, TD, TH    
    -->
    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45 919 049</td>
            </tr>
            <tr>
                <td>Parana</td>
                <td class="num">20 400 020</td>
            </tr>
            <tr>
                <td>Minas</td>
                <td class="num">34 405 004</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">40 993 149</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td class="num">10 000 000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total de Habitantes</th>
                <td  class="num"><strong>200 370 320</strong></th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
